<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SideQuest V11.3</title><style>/*__LOCAL_CSS__*/
/*__RUNTIME_CSS__*/</style></head><body>
<div id="sidequest-app-main">
  <div class="sq-stage">
    <section class="sq-window" aria-label="SideQuest 任务面板">
      <header class="sq-toolbar" aria-label="拖动此处移动窗口">
        <span class="sq-brand">SideQuest</span>
        <span class="sq-observer" aria-live="polite"><span class="sq-dot"></span><span data-status>观察中</span></span>
        <div class="sq-tools">
          <button class="sq-icon cursor-interaction" data-action="pause" aria-label="暂停观察" aria-pressed="false" data-tooltip="暂停观察"><i data-lucide="pause" aria-hidden="true"></i></button>
          <button class="sq-icon cursor-interaction" data-action="pin" aria-label="窗口置顶" aria-pressed="true" data-tooltip="窗口置顶"><i data-lucide="pin" aria-hidden="true"></i></button>
          <button class="sq-icon cursor-interaction" data-action="menu" aria-label="更多设置" aria-expanded="false" aria-controls="sq-menu"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
          <span class="sq-tool-divider" aria-hidden="true"></span>
          <button class="sq-icon cursor-interaction" data-action="minimize" aria-label="最小化为窄条" data-tooltip="最小化为窄条"><i data-lucide="minus" aria-hidden="true"></i></button>
          <button class="sq-icon cursor-interaction" data-action="close" aria-label="关闭应用" data-tooltip="关闭应用（退出）"><i data-lucide="x" aria-hidden="true"></i></button>
        </div>
      </header>
      <button class="sq-mini-restore cursor-interaction" data-action="minimize" aria-label="还原任务面板" hidden><span data-mini-title>SideQuest</span><span>还原<i data-lucide="chevron-down" aria-hidden="true"></i></span></button>
      <div id="sq-menu" class="sq-menu" hidden>
        <button class="sq-menu-item cursor-interaction" data-action="settings"><i data-lucide="settings-2" aria-hidden="true"></i>外观与设置</button>
        <button class="sq-menu-item cursor-interaction" data-action="dock" aria-pressed="false"><i data-lucide="panel-right" aria-hidden="true"></i><span data-dock-label>贴边自动隐藏：开启</span></button>
        <button class="sq-menu-item cursor-interaction" data-action="dockleft"><i data-lucide="panel-left" aria-hidden="true"></i>停靠左边</button>
        <button class="sq-menu-item cursor-interaction" data-action="dockright"><i data-lucide="panel-right" aria-hidden="true"></i>停靠右边</button>
        <button class="sq-menu-item cursor-interaction" data-action="resetgeometry"><i data-lucide="rotate-ccw" aria-hidden="true"></i>重置窗口大小与位置</button>
        <button class="sq-menu-item cursor-interaction" data-action="hide"><i data-lucide="minus" aria-hidden="true"></i>隐藏到托盘</button>
      </div>
      <div class="sq-viewport" aria-label="可滚动任务内容">
      <div class="sq-main-view">
        <div class="sq-focus">
          <div class="sq-primary-row">
            <div class="sq-ring" role="img" aria-label="任务进度待估算"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="sq-ring-track" cx="32" cy="32" r="27"/><circle class="sq-ring-fill" cx="32" cy="32" r="27" stroke-dasharray="0 170"/></svg><span>主线</span></div>
            <div class="sq-primary-copy"><h2 data-main-title><button class="sq-title-toggle cursor-interaction" data-action="expand" aria-label="主线任务，点击收起或展开其他任务" aria-expanded="true" aria-controls="sq-task-list"><span data-title>正在读取任务…</span><span data-main-chevron><i data-lucide="chevron-down" aria-hidden="true"></i></span></button></h2><div class="sq-estimate" data-estimate hidden>待估算</div></div>
            <button class="sq-check cursor-interaction" data-action="complete" aria-label="标记当前任务完成" data-tooltip="标记完成"><i data-lucide="check" aria-hidden="true"></i></button>
          </div>
          <p class="sq-live" data-progress>暂无实时进展</p>
          <div class="sq-task-progress sq-main-progress"><div class="sq-progress-track" data-main-bar role="progressbar" aria-label="当前任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuetext="待估算"><span class="sq-progress-fill" data-main-fill style="width:0%"></span><span class="sq-progress-range" data-main-range style="left:0%;width:0%"></span></div><span class="sq-progress-label" data-main-bar-label>待估算</span></div>
          <div class="sq-next"><div class="sq-next-label"><i data-lucide="corner-down-right" aria-hidden="true"></i>下一步建议</div><p data-next>暂无下一步建议</p></div>
          <details class="sq-steps"><summary class="cursor-interaction" aria-expanded="false" aria-controls="sq-step-content"><span>报价步骤</span><span data-step-count>0 / 0</span><i data-lucide="chevron-down" aria-hidden="true"></i></summary><div id="sq-step-content" class="sq-steps-content" hidden><div class="sq-step-list"></div></div></details>
        </div>
        <div class="sq-observation"><i data-lucide="eye" aria-hidden="true"></i><div><span>当前活动</span><p>暂无当前活动</p></div></div>
        <div class="sq-feedback" role="status" hidden><span data-message></span><button class="sq-text-button cursor-interaction" data-action="undo" hidden>撤销</button></div>
        <button class="sq-list-toggle cursor-interaction" data-action="expand" aria-expanded="true" aria-controls="sq-task-list"><span>支线任务 <span class="sq-count">0</span></span><span class="sq-toggle-label"><span data-list-state>收起</span><i data-lucide="chevron-down" aria-hidden="true"></i></span></button>
        <div id="sq-task-list"></div>
        <footer class="sq-footer"><span data-updated>等待数据</span><button class="sq-text-button cursor-interaction" data-action="summary">今日总结</button><button class="sq-text-button cursor-interaction" data-action="history" aria-expanded="false">任务记录<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></footer>
        <div class="sq-history" hidden><div class="sq-section-title">任务记录 · 保留所有状态</div><div data-history-list></div></div>
      </div>
      <section class="sq-settings" aria-label="外观设置" hidden>
        <div class="sq-settings-header"><h2>外观与设置</h2><button class="sq-icon cursor-interaction" data-action="back" aria-label="返回任务"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <fieldset><legend>皮肤</legend><label><input name="sq-skin" type="radio" value="glass" checked>深蓝玻璃</label><label><input name="sq-skin" type="radio" value="transparent">轻透悬浮</label><label><input name="sq-skin" type="radio" value="journal">杂志手账</label><label><input name="sq-skin" type="radio" value="night">夜航 HUD</label></fieldset>
        <label class="sq-font-label" for="sq-font">界面字号 <output id="sq-font-value">14</output></label><input id="sq-font" type="range" min="13" max="21" value="14">
        <p class="sq-setting-note">外观修改会自动保存。</p>
        <button class="sq-return cursor-interaction" data-action="details">模型与采样设置</button><button class="sq-return cursor-interaction" data-action="back">返回任务</button>
      </section>
      </div>
      <button class="sq-resize-handle" aria-label="调整窗口大小：拖动，或用方向键调节；Shift 加速" data-tooltip="拖动调整宽高"><i data-lucide="maximize-2" aria-hidden="true"></i></button>
    </section>
    <button class="sq-edge-tab" data-action="revealedge" aria-label="展开 SideQuest 贴边面板" aria-expanded="false" hidden><i data-lucide="chevron-left" aria-hidden="true"></i></button>

  </div>
</div>

<script>/*__LOCAL_ICONS__*/</script><script>/*__LOCAL_APP__*/</script></body></html>
